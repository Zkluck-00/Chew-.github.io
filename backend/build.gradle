plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'pe.chew'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}

def sintaxisH2 = [
		'TIMESTAMPTZ': 'TIMESTAMP WITH TIME ZONE',
		'UUID NOT NULL UNIQUE DEFAULT gen_random_uuid()': 'UUID DEFAULT gen_random_uuid() NOT NULL UNIQUE',
		'ALTER TABLE detalles_pedido DROP CONSTRAINT detalles_pedido_pkey': 'ALTER TABLE detalles_pedido DROP PRIMARY KEY'
]

tasks.named('processTestResources') {
	inputs.property('sintaxisH2', sintaxisH2)
	from('src/main/resources/db/migration') {
		into('db/h2')
		// Adapta la sintaxis de PostgreSQL únicamente en los recursos de pruebas.
		filter { line -> sintaxisH2.inject(line) { sql, regla -> sql.replace(regla.key, regla.value) } }
	}
}
