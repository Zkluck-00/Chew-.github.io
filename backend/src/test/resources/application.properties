spring.application.name=chew-tests
server.port=0
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:h2:mem:chewtests;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
